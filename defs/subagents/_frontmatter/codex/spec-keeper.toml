name = "spec-keeper"
description = "Owns _spec/*.puml, the spec↔source coverage index, and planning docs. Decides when a PLAN, diff, or drift report warrants a spec update; never edits source code. Use proactively when _spec/, planning docs, architecture boundaries, or harness contracts change."
# The single writer, and the only agent here that is not read-only. Its prompt
# scopes it to _spec/, PLAN.md and AGENTS.md; workspace-write is what lets it
# act on that scope at all.
sandbox_mode = "workspace-write"
