# proveo baked defaults for the Codex CLI; the argv can still override every key.
# proveo_merge_codex_defaults adds each top-level key missing from $CODEX_HOME/config.toml;
# CODEX_RESEED=1 resets them. Approval and sandbox keys belong to the codex kit's install hook.

# Reasoning summaries stay visible. The harness's evidence posture is that an
# operator reading a transcript can tell what the agent did and why; hiding the
# summary buys nothing here and removes the only in-band account of a wrong turn.
hide_agent_reasoning = false

# Codex reads AGENTS.md natively — no CLAUDE.md bridge is written into the
# operator's checkout. A repo that steers agents through one of these instead is
# still read, in this order, rather than being silently ignored.
project_doc_fallback_filenames = ["CLAUDE.md", "CONVENTIONS.md"]
