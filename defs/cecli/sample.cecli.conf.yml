# Cecli Configuration (Aider-compatible)
# Copy this file to .cecli.conf.yml in your project root
# See all options: https://cecli.dev/

# Model selection (aliases: sonnet, opus, gpt-5.2, grok-4-latest, gemini, deepseek)
model: sonnet

# Agent mode
agent: true
auto-commits: true
auto-save: true
auto-load: false
cache-prompts: true
# false because the image cannot satisfy it: cecli lives in /opt/cecli, a venv
# built as root and never chowned, and the run is non-root. An updater that
# tries there fails every run; one that SUCCEEDED would unpin CECLI_VERSION.
check-update: false
debug: false
enable-context-compaction: true
context-compaction-max-tokens: 0.8
show-model-warnings: true
use-enhanced-map: true
watch-files: false
tui: true

# Git settings
gitignore: false

# Read conventions file on startup
read:
  - CONVENTIONS.md

# Editor behavior
# auto-lint: true
# auto-test: false

# UI settings
# dark-mode: true
# stream: true

# Advanced
# map-tokens: 1024

agent-config:
  large_file_token_threshold: 8192
  skip_cli_confirmations: false
  max_sub_agents: 3
  subagent_paths:
    - .cecli/agents
    - /app/.cecli/agents

mcp-servers:
  mcpServers:
    context7:
      transport: http
      url: https://mcp.context7.com/mcp

# ─────────────────────────────────────────────────────────────
# Environment passthroughs (.env): DARK_MODE=true → dark mode UI · CODE_THEME → code theme.
# Choose the model with `model:` above, or CECLI_MODEL / CECLI_EDITOR_MODEL / CECLI_WEAK_MODEL.
# ─────────────────────────────────────────────────────────────
