# Go is pinned HERE and in go.mod (`toolchain go1.26.5`). Two pins, kept byte-equal
# by internal/contract TestMiseGoPinMatchesGoModToolchain, so `mise run <task>` and
# GOTOOLCHAIN=auto resolve the same compiler instead of racing over one build cache.
#
# It was deliberately absent until the retirement of `g` (github.com/stefanmaric/g):
# with `g` owning a GOROOT, a mise pin meant a SECOND one, and two toolchains over
# one build cache fail with `compile: version "goX" does not match go tool version
# "goY"`. `g` is gone — it hands back a GOROOT and stops, leaving every consumer to
# find it through a shell rc. A sandbox has no persistent rc to write one into, so
# `mise run` reported `go: command not found` with a working toolchain on disk.
# mise's shims are already on PATH on every backend.
# SPEC: _spec/_runtimes/toolchain-provisioning.puml
[tools]
go = "1.26.5"
node = "24"
pnpm = "10"
tmux = "3.7b"
golangci-lint = "2.12.2"

[tasks.install]
description = "Install root workspace dependencies"
run = "pnpm install"

# ── Go format / lint (golangci-lint v2) ─────────────────────

[tasks.fmt]
description = "Format Go sources (golangci-lint fmt: gofmt + goimports)"
dir = "{{config_root}}"
run = "golangci-lint fmt"

[tasks.lint]
description = "Go format check + go vet + golangci-lint (standard linters)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev lint"

[tasks.install-git-hooks]
description = "Copy scripts/githooks/post-commit into .git/hooks (no git config)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev hooks install"

[tasks.build-check]
description = "Compile all Go packages (go build ./...)"
dir = "{{config_root}}"
run = "go build ./..."

[tasks.ci]
description = "Local CI gate: lint + go build + unit/contract tests (no Docker)"
depends = ["lint", "build-check", "test-go"]
run = "printf '\\n✅ ci succeeded.\\n'"

# ── Go CLI ──────────────────────────────────────────────────

[tasks.build-cli]
description = "Install Go proveo CLIs onto GOPATH/bin; pass -- --release for goreleaser → dist/ + CDN stage"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev build-cli"

# ── Tests ───────────────────────────────────────────────────

[tasks.test-go]
description = "Go unit + contract tests with coverage data dir (no Docker / no integration tags)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev coverage unit"

[tasks.test]
description = "Fast gate: Go unit + contract tests (same as test-go)"
depends = ["test-go"]

[tasks.test-go-integration]
description = "Layer 3 egress Docker integration (-tags=integration; needs PROVEO_EGRESS_INTEGRATION=1)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev coverage integration"

[tasks.test-go-e2e]
description = "Layer 4 agent E2E (-tags=e2e; skips per missing prerequisite: tmux/docker/image/credential)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev coverage e2e"

[tasks.coverage]
description = "Merge GOCOVERDIR profiles and print percent (run test-go first)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev coverage merge"

[tasks.test-images]
description = "Docker/image + consumer CLI suites (needs Docker; slow)"
dir = "{{config_root}}"
# The installer suite runs install.sh under /bin/bash against the staged CDN;
# the image suites are Go (internal/imagetest, build tag `image`).
run = [
  "go run ./cmd/proveo-dev stage-cdn",
  "PROVEO_INSTALLTEST_CDN=apps/cli/public/cli go test -count=1 ./internal/installtest/",
  "go test -tags=image -count=1 -timeout 60m ./internal/imagetest/",
]

[tasks.test-all]
description = "Fast Go gate then Docker/image megasuite"
depends = ["test-go", "test-images"]

[tasks.test-images-sbx]
description = "Image + consumer CLI suites that test the sbx runtime (no mitmproxy sidecar, no docker-detached smoke)"
dir = "{{config_root}}"
run = [
  "go run ./cmd/proveo-dev stage-cdn",
  "PROVEO_INSTALLTEST_CDN=apps/cli/public/cli go test -count=1 ./internal/installtest/",
  "go test -tags=image -count=1 -timeout 60m -run '^TestImage(Cecli|Claudecode|Codex|Opencode|Cursor)$' ./internal/imagetest/",
]

[tasks.test-e2e]
description = "Everything e2e up to tier 3, on the sbx runtime: image + consumer suites, then the Go agent suite (opt-in gates off; ~45m)"
dir = "{{config_root}}"
depends = ["test-images-sbx"]
run = "go run ./cmd/proveo-dev coverage e2e"

[tasks.test-e2e-full]
description = "test-e2e plus tier 4: idle/signal/toolchain gates, per-def silent-death idle-all, then the sbx ladder. PROVEO_CAPACITY_TEST stays off: it exhausts the host by design."
dir = "{{config_root}}"
depends = ["test-images-sbx"]
# Both host halves keep going after a failure: stopping at idle hides whether
# the ladder shares the fault. A SKIP on either is not a pass.
# SPEC: _spec/_devops/release-gate.puml
run = "go run ./cmd/proveo-dev e2e-full"

[tasks.ladder-all]
description = "Climb the sbx ladder for every def (host only: needs sbx)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev ladder"

[tasks.idle-all]
description = "Idle-survival sweep for every def (host only: needs sbx; catches silent deaths)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev idle"

# ── Consumer CDN (apps/cli) ─────────────────────────────────

[tasks.wrangler-version]
description = "Show the local wrangler version"
run = "pnpm exec wrangler --version"

[tasks.deploy-cli]
description = "Goreleaser (tag→semver, else snapshot) → stage CDN → Wrangler deploy apps/cli"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev deploy-cli"

[tasks.dev-cli]
description = "Stage Go CDN binaries then run apps/cli Cloudflare assets locally with Wrangler"
dir = "{{config_root}}"
run = "go run ./cmd/proveo-dev dev-cli"

# ── Harness images (maintainer) ─────────────────────────────

[tasks.build]
description = "Build a container harness def (buildx; host arch --load)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo build"

[tasks.test-defs]
description = "Test a container harness def's image (Go: proveo test)"
dir = "{{config_root}}"
run = "go run ./cmd/proveo test"

[tasks.deploy]
description = "Buildx --push multi-arch (amd64+arm64) container image def"
dir = "{{config_root}}"
run = "go run ./cmd/proveo deploy"

[tasks.debug]
description = "Debug a container harness def (shell via proveo run --shell)"
dir = "{{config_root}}"
depends = ["build-cli"]
run = "go run ./cmd/proveo-dev debug"
