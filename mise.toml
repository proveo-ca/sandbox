# allow_builds (npm:wrangler) runs only its list from mise 2026.10.17.
min_version = "2026.10.17"

# Top-level tests `mise run test --baseline` skips; reasons live in the SPEC.
# SPEC: _spec/_devops/unit-baseline.puml
[vars]
unit_baseline = """\
  TestAConfigSaveNoLongerCarriesProjects|\
  TestARestorePastTheArgumentLimitPlacesEveryFile|\
  TestARestoreThatFailsMidFileNeverTruncatesTheHost|\
  TestAdbMirrorStartsWithTheSocketAddress|\
  TestClaudeProjectKeyMatchesClaudeCode|\
  TestCodexDaemonStateNeverCrossesTheSandbox|\
  TestConfigSyncComparesSubSecondMtimes|\
  TestConfigSyncCopiesInBulk|\
  TestConfigSyncLeavesTheStateDirsToTheStateSync|\
  TestConfigSyncNeverCarriesADeniedFileOut|\
  TestConfigSyncNeverGlobsTheSkipListAgainstTheCwd|\
  TestConfigSyncRoundTripsTheHarnessConfiguration|\
  TestConfigSyncSkipsTransientPathsBothWays|\
  TestGitHubSSHVerificationRequiresAnAgentAndAcceptsGitHubExitOne|\
  TestImageSuitesResolveRatherThanPinThePublishTag|\
  TestOpenCodeCredentialHookWaitsForHistory|\
  TestOpenCodeNativeGitSyncPluginLifecycle|\
  TestOpenCodeSeedProgressFixtures|\
  TestOpencodeV2SeedOwnership|\
  TestProjectsAndTodosRoundTripOnPlainDirectories|\
  TestStateRestoreCopiesOnlyThisWorkspacesProjects|\
  TestStateRestoreNeverRevertsANewerGuestTurn|\
  TestStateSaveRefusesWithoutThisBootsRestore|\
  TestTwoWorkspacesSharingOneStoreKeepEachOthersTurns|\
  TestVMLocalPathsNeverCrossEitherSync|\
  TestVarsSortByScopeThenName|\
  TestWithoutStateDirsTheKitVolumesTravelAsState\
  """

# Go is pinned here and in go.mod (`toolchain go1.26.10`); keep the two byte-equal.
# internal/contract TestMiseGoPinMatchesGoModToolchain fails when they drift.
# SPEC: _spec/_runtimes/toolchain-provisioning.puml
[tools]
go = "1.26.10"
node = "24"
"npm:wrangler" = { version = "4.100.0", allow_builds = ["esbuild", "sharp", "workerd"] }
tmux = "3.7b"
golangci-lint = "2.12.2"

# ── Contributor: format, lint, hooks, CI ────────────────────

[tasks.fmt]
description = "Format Go sources (golangci-lint fmt: gofmt + goimports)"
dir = "{{config_root}}"
run = "golangci-lint fmt"

[tasks.lint]
description = "gofmt + comment-block contract tests, go build, go vet (default, image, e2e tags), golangci-lint run"
dir = "{{config_root}}"
run = [
  "go test -count=1 '-run=^(TestEveryTrackedGoFileIsGofmted|TestNoCommentBlockOverThreeLines)$' ./internal/contract/",
  "go build ./...",
  "go vet ./...",
  "go vet -tags=image ./internal/imagetest/",
  "go vet -tags=e2e ./e2e/",
  "golangci-lint run",
]

# SPEC: _spec/_devops/git-hooks.puml
[tasks.post-commit]
description = "Git post-commit body: fmt, then lint; SKIP_GIT_HOOKS=1 skips it"
hide = true
dir = "{{config_root}}"
skip_if = "{% if get_env(name='SKIP_GIT_HOOKS', default='') | trim | lower in ['1', 'true', 'yes', 'on', 'enable', 'enabled'] %}true{% else %}false{% endif %}"
run = [{ task = "fmt" }, { task = "lint" }]

[tasks.install-git-hooks]
description = "Write .git/hooks/post-commit with mise's generator (it execs mise run post-commit); sets no git config"
dir = "{{config_root}}"
run = "mise generate git-pre-commit --hook post-commit --task post-commit --write"

[tasks.ci]
description = "Local CI gate: lint (go build included) + unit/contract tests (no Docker); --no-race reaches test"
usage = 'flag "--no-race" help="run test without the race detector (a toolchain without cgo)"'
run = "mise run lint ::: test{% if usage.no_race %} --no-race{% endif %}"

# ── Tests ───────────────────────────────────────────────────

# SPEC: _spec/_devops/unit-baseline.puml
[tasks.test]
description = "Go unit + contract tests with -race, then the coverage percent and cov/coverage.out (no Docker / no integration tags)"
dir = "{{config_root}}"
usage = '''
flag "--no-race" help="run without the race detector (a toolchain without cgo)"
flag "--baseline" help="skip the [vars] unit_baseline tests, the ones already red"
arg "[go_test_args]..." var=#true default="./..." help="packages, or go test flags after --"
'''
run = [
  "rm -rf cov/unit",
  "mkdir -p cov/unit",
  "go test {% if not usage.no_race %}-race {% endif %}{% if usage.baseline %}-skip={{ ('^(' ~ vars.unit_baseline ~ ')$') | quote }} {% endif %}-cover -covermode=atomic{% for a in usage.go_test_args %} {{ a | quote }}{% endfor %} -args -test.gocoverdir={{ config_root | quote }}/cov/unit",
  "go tool covdata percent -i=cov/unit",
  "go tool covdata textfmt -i=cov/unit -o=cov/coverage.out",
]

# SPEC: _spec/internal/cdn/distribution-update.puml
[tasks.test-images]
description = "Every image suite (TestImage*) + the installer suite against a fresh snapshot CDN stage (needs Docker; slow)"
dir = "{{config_root}}"
tools = { goreleaser = "2.17.0" }
env = { PROVEO_INSTALLTEST_CDN = "apps/cli/public/cli" }
run = [
  "goreleaser release --snapshot --clean",
  "go run ./internal/cdn/stage",
  "go test -count=1 ./internal/installtest/",
  "go test -tags=image -count=1 -timeout 60m ./internal/imagetest/",
]

[tasks.test-defs]
description = "Run the image suite of a def, or of all (each suite once; bases have none)"
dir = "{{config_root}}"
usage = '''
arg "<target>" help="a registry target, or all" {
  choices "all" "base" "base-node" "base-node-browser" "claudecode" "claudecode-browser" "claudecode-solidity" "codex" "codex-browser" "cursor" "cursor-browser" "hermes" "opencode" "opencode-browser"
}
flag "--print" help="print the go test lines instead of running them"
'''
run = "go run ./internal/maintain/fleet {% if usage.print %}-print {% endif %}test {{ usage.target | quote }}"

[tasks.test-e2e]
description = "Everything e2e up to tier 3, on the sbx runtime: image + consumer suites, then the Go agent suite (opt-in gates off; ~45m); extra args reach go test, --skip-deps skips the image suites"
dir = "{{config_root}}"
depends = ["test-images"]
run = "go test -tags=e2e ./e2e/ -count=1 -timeout {% set timeout = get_env(name='PROVEO_TEST_GO_TIMEOUT', default='') | trim %}{% if timeout %}{{ timeout | quote }}{% else %}45m{% endif %}"

# SPEC: _spec/_devops/release-gate.puml
[tasks.test-e2e-full]
description = "test-e2e plus tier 4: the e2e suite with idle/toolchain gates on, test-idle, then test-ladder; every half runs, and a skip inside an opted-in gate fails. PROVEO_CAPACITY_TEST stays off: it exhausts the host by design."
dir = "{{config_root}}"
depends = ["test-images"]
usage = 'arg "[go_test_args]..." var=#true help="go test arguments for the e2e pass; test-idle and test-ladder take none"'
run = "mise run --continue-on-error e2e-gated{% for a in usage.go_test_args %} {{ a | quote }}{% endfor %} ::: test-idle ::: test-ladder"

[tasks.e2e-gated]
description = "test-e2e-full's first half: the e2e suite with PROVEO_IDLE_TEST and PROVEO_TOOLCHAIN_TEST on"
hide = true
dir = "{{config_root}}"
env = { PROVEO_IDLE_TEST = "1", PROVEO_TOOLCHAIN_TEST = "1" }
run = "go test -tags=e2e ./e2e/ -count=1 -timeout {% set timeout = get_env(name='PROVEO_TEST_GO_TIMEOUT', default='') | trim %}{% if timeout %}{{ timeout | quote }}{% else %}150m{% endif %}"

[tasks.test-idle]
description = "Idle-survival sweep for claudecode, cursor and opencode, idling PROVEO_IDLE_FOR (default 45s) (host only: needs sbx; a skip fails it)"
dir = "{{config_root}}"
wait_for = ["e2e-gated"]
env = { PROVEO_IDLE_TEST = "1", PROVEO_IDLE_TARGETS = "claudecode,cursor,opencode", PROVEO_IDLE_FOR = "{% set idle = get_env(name='PROVEO_IDLE_FOR', default='') | trim %}{% if idle %}{{ idle }}{% else %}45s{% endif %}" }
run = "go test -tags=e2e -count=1 -timeout 30m ./e2e/ -run=^TestAgentSurvivesIdleAtPrompt$ -v"

[tasks.test-ladder]
description = "Climb the sbx ladder for every def, one go test process each, past a red def (host only: needs sbx)"
dir = "{{config_root}}"
wait_for = ["test-idle"]
run = "mise run --continue-on-error --jobs=1 ladder:claudecode ::: ladder:codex ::: ladder:cursor ::: ladder:opencode"

[tasks."ladder:claudecode"]
description = "Climb the sbx ladder for claudecode (a skip fails it)"
hide = true
dir = "{{config_root}}"
env = { PROVEO_LADDER_TEST = "1", PROVEO_LADDER_TARGET = "claudecode" }
run = "go test -tags=e2e -count=1 -timeout 30m ./e2e/ -run=^TestSandboxLadder$ -v"

[tasks."ladder:codex"]
description = "Climb the sbx ladder for codex (a skip fails it)"
hide = true
dir = "{{config_root}}"
env = { PROVEO_LADDER_TEST = "1", PROVEO_LADDER_TARGET = "codex" }
run = "go test -tags=e2e -count=1 -timeout 30m ./e2e/ -run=^TestSandboxLadder$ -v"

[tasks."ladder:cursor"]
description = "Climb the sbx ladder for cursor (a skip fails it)"
hide = true
dir = "{{config_root}}"
env = { PROVEO_LADDER_TEST = "1", PROVEO_LADDER_TARGET = "cursor" }
run = "go test -tags=e2e -count=1 -timeout 30m ./e2e/ -run=^TestSandboxLadder$ -v"

[tasks."ladder:opencode"]
description = "Climb the sbx ladder for opencode (a skip fails it)"
hide = true
dir = "{{config_root}}"
env = { PROVEO_LADDER_TEST = "1", PROVEO_LADDER_TARGET = "opencode" }
run = "go test -tags=e2e -count=1 -timeout 30m ./e2e/ -run=^TestSandboxLadder$ -v"

# ── Maintainer: build, preview, deploy ──────────────────────

# SPEC: _spec/internal/maintain/image-build-deploy.puml, _spec/cmd/proveo/usage.puml
[tasks.build]
description = "Build harness image(s) as :local with buildx --load (bases serially, then harness waves concurrently); --cli first go installs proveo and proveo-entrypoint into GOPATH/bin"
dir = "{{config_root}}"
usage = '''
arg "[target]" help="a registry target, or all; optional with --cli" {
  choices "all" "base" "base-node" "base-node-browser" "claudecode" "claudecode-browser" "claudecode-solidity" "codex" "codex-browser" "cursor" "cursor-browser" "hermes" "opencode" "opencode-browser"
}
flag "--cli" help="first go install proveo and proveo-entrypoint into GOPATH/bin (version dev@<sha>)"
flag "--tag <tag>" default="local" help="image tag to build (:latest is refused for --load)"
flag "--no-cache" help="pass --no-cache to docker buildx build"
flag "--print" help="print the wave plan instead of running it"
'''
run = "go run ./internal/maintain/fleet -tag={{ usage.tag | quote }} {% if usage.no_cache %}-no-cache {% endif %}{% if usage.print %}-print {% endif %}{% if usage.cli %}-cli {% endif %}build{% if usage.target %} {{ usage.target | quote }}{% endif %}"

# SPEC: _spec/internal/cdn/distribution-update.puml
[tasks.dev-cli]
description = "Snapshot HEAD, stage the CDN tree, serve apps/cli locally with wrangler dev (never deploys)"
dir = "{{config_root}}"
tools = { goreleaser = "2.17.0" }
run = [
  "goreleaser release --snapshot --clean",
  "go run ./internal/cdn/stage",
  "wrangler dev --cwd apps/cli",
]

# SPEC: _spec/internal/maintain/image-build-deploy.puml, _spec/internal/cdn/distribution-update.puml
[tasks.deploy]
description = "Promote :local to the tag and buildx --push amd64+arm64 (bases serially, then harness waves concurrently), then untag :local; --cli first cuts, publishes and pushes a CLI release"
dir = "{{config_root}}"
tools = { goreleaser = "2.17.0" }
usage = '''
arg "[target]" help="a registry target, or all; optional with --cli" {
  choices "all" "base" "base-node" "base-node-browser" "claudecode" "claudecode-browser" "claudecode-solidity" "codex" "codex-browser" "cursor" "cursor-browser" "hermes" "opencode" "opencode-browser"
}
flag "--cli" help="first cut a CLI release (goreleaser, CDN stage, commit latest.json, tag it), wrangler deploy apps/cli, then push main and the tag"
flag "--cli-version <version>" default="patch" help="--cli: patch, minor, major, or an explicit vX.Y.Z"
flag "--yes" help="--cli: answer its question before publishing (unattended runs)"
flag "--tag <tag>" default="latest" help="image tag to publish (promoted from the :local build)"
flag "--print" help="print the plan instead of running it"
'''
run = "go run ./internal/maintain/fleet -tag={{ usage.tag | quote }} {% if usage.print %}-print {% endif %}{% if usage.cli %}-cli -cli-version={{ usage.cli_version | quote }} {% endif %}{% if usage.yes %}-yes {% endif %}deploy{% if usage.target %} {{ usage.target | quote }}{% endif %}"
