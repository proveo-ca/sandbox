# Go is pinned in go.mod (`toolchain go1.26.5`) — the one place every tool obeys
# via GOTOOLCHAIN=auto, including CI. It is deliberately absent here: mise would
# install a SECOND GOROOT alongside the one `g` (github.com/stefanmaric/g) manages,
# and two toolchains over one build cache fail with
# `compile: version "goX" does not match go tool version "goY"`.
#   g install 1.26.5   # match go.mod locally (download + activate)
#   g list             # what's installed / active
[tools]
node = "24"
pnpm = "10"
tmux = "3.7b"
golangci-lint = "2.12.2"

[tasks.install]
description = "Install root workspace dependencies"
run = "pnpm install"

# ── Go format / lint (golangci-lint v2) ─────────────────────

[tasks.fmt]
description = "Format Go sources (golangci-lint fmt: gofmt + goimports)"
dir = "{{config_root}}"
run = "golangci-lint fmt"

[tasks.lint]
description = "Go format check + go vet + golangci-lint (standard linters)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Hard gates: gofmt -l · go vet · golangci-lint run
unformatted="$(gofmt -l internal cmd tests 2>/dev/null || true)"
# Also cover any other module packages (embed.go at root, etc.)
unformatted_root="$(gofmt -l *.go 2>/dev/null || true)"
if [[ -n "${unformatted}${unformatted_root}" ]]; then
  printf 'gofmt needed on:\\n%s\\n%s\\n' "$unformatted" "$unformatted_root" >&2
  printf 'Run: mise run fmt\\n' >&2
  exit 1
fi
go vet ./...
golangci-lint run
printf '\\n✅ lint succeeded.\\n'
"""

[tasks.build-check]
description = "Compile all Go packages (go build ./...)"
dir = "{{config_root}}"
run = "go build ./..."

[tasks.ci]
description = "Local CI gate: lint + go build + unit/contract tests (no Docker)"
depends = ["lint", "build-check", "test-go"]
run = """
#!/usr/bin/env bash
set -euo pipefail
printf '\\n✅ ci succeeded.\\n'
"""

# ── Go CLI ──────────────────────────────────────────────────

[tasks.build-cli]
description = "Install Go proveo CLIs onto GOPATH/bin; pass -- --release for goreleaser → dist/ + CDN stage"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
release=0
while [[ $# -gt 0 ]]; do
  case "$1" in
    --release) release=1; shift ;;
    -h|--help)
      printf 'Usage: mise run build-cli [-- --release]\\n'
      printf '  (default) go install → $(go env GOPATH)/bin (version=dev@sha)\\n'
      printf '  --release runs goreleaser into dist/, then stages apps/cli CDN assets:\\n'
      printf '    • HEAD is an exact git tag (vX.Y.Z) → goreleaser release --skip=publish\\n'
      printf '      (version from the tag; no GitHub Release — CDN is Wrangler)\\n'
      printf '    • otherwise → goreleaser release --snapshot (dev/CI dry-run)\\n'
      exit 0
      ;;
    *)
      echo "Unknown build-cli option: $1 (want --release)" >&2
      exit 1
      ;;
  esac
done

export CGO_ENABLED=0
# Prefer GOPATH/bin over a toolchain-local GOBIN (mise may set the latter).
export GOBIN="$(go env GOPATH)/bin"
mkdir -p "$GOBIN"
# Stamp the build commit so `proveo --version` can tell a stale binary from a fresh one.
commit="$(git rev-parse --short HEAD 2>/dev/null || true)"
if [[ -z "$commit" ]]; then
  commit="unknown"
fi
proveo_version="dev@${commit}"
go install -trimpath -ldflags="-s -w -X main.version=${proveo_version}" ./cmd/proveo
go install -trimpath -ldflags='-s -w' ./cmd/proveo-egress
go install -trimpath -ldflags='-s -w' ./cmd/proveo-entrypoint
printf 'Installed %s/{proveo,proveo-egress,proveo-entrypoint} (%s)\\n' "$GOBIN" "$proveo_version"
printf 'Ensure %s is on PATH (or set PROVEO_BIN).\\n' "$GOBIN"

if [[ "$release" -eq 1 ]]; then
  if ! command -v goreleaser >/dev/null 2>&1; then
    # Pinned (not @latest) so release builds are reproducible; bump deliberately.
    goreleaser_version="v2.17.0"
    echo "goreleaser not on PATH — installing $goreleaser_version via go install..." >&2
    go install "github.com/goreleaser/goreleaser/v2@$goreleaser_version"
    export PATH="$(go env GOPATH)/bin:$PATH"
  fi
  # Tag-exact HEAD → real semver artifacts for the Wrangler CDN (skip GitHub publish).
  # Untagged / dirty release builds stay --snapshot for local dry-runs.
  tag="$(git describe --tags --exact-match 2>/dev/null || true)"
  if [[ -n "$tag" ]]; then
    printf 'Tagged HEAD %s — goreleaser release --skip=publish (CDN-only)\\n' "$tag"
    goreleaser release --clean --skip=publish
  else
    printf 'No exact git tag on HEAD — goreleaser release --snapshot\\n'
    goreleaser release --snapshot --clean
  fi
  printf 'Artifacts under dist/ (gitignored).\\n'
  PROVEO_CDN_REQUIRE_DIST=1 bash scripts/stage-cli-cdn.sh
fi

# set -euo pipefail guarantees we only reach here on success.
printf '\\n✅ build-cli succeeded.\\n'
"""

# ── Tests ───────────────────────────────────────────────────

[tasks.test-go]
description = "Go unit + contract tests with coverage data dir (no Docker / no integration tags)"
dir = "{{config_root}}"
run = "scripts/go-test-coverage.sh unit"

[tasks.test]
description = "Fast gate: Go unit + contract tests (same as test-go)"
depends = ["test-go"]

[tasks.test-go-integration]
description = "Layer 3 egress Docker integration (-tags=integration; needs PROVEO_EGRESS_INTEGRATION=1)"
dir = "{{config_root}}"
run = "scripts/go-test-coverage.sh integration"

[tasks.test-go-e2e]
description = "Layer 4 agent E2E (-tags=e2e; skips per missing prerequisite: tmux/docker/image/credential)"
dir = "{{config_root}}"
run = "scripts/go-test-coverage.sh e2e"

[tasks.coverage]
description = "Merge GOCOVERDIR profiles and print percent (run test-go first)"
dir = "{{config_root}}"
run = "scripts/go-test-coverage.sh merge"

[tasks.test-images]
description = "Docker/image + consumer CLI suites (needs Docker; slow)"
dir = "{{config_root}}"
run = """
set -euo pipefail
bash scripts/stage-cli-cdn.sh

tests=(
  "apps/cli/public/cli/tests/run_tests.sh"
  "tests/docker-detached-smoke.sh"
  "defs/cecli/test.sh"
  "defs/sidecars/mitmproxy/test.sh"
  "defs/claudecode/test.sh"
  "defs/opencode/test.sh"
  "defs/cursor/test.sh"
)

for test_script in "${tests[@]}"; do
  printf '\\n==> %s\\n' "$test_script"
  "$test_script"
done
"""

[tasks.test-all]
description = "Fast Go gate then Docker/image megasuite"
depends = ["test-go", "test-images"]

# ── Consumer CDN (apps/cli) ─────────────────────────────────

[tasks.wrangler-version]
description = "Show the local wrangler version"
run = "pnpm exec wrangler --version"

[tasks.deploy-cli]
description = "Goreleaser (tag→semver, else snapshot) → stage CDN → Wrangler deploy apps/cli"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
# build-cli --release: on an exact git tag uses goreleaser --skip=publish (version from
# the tag, no GitHub Release); otherwise --snapshot. Then stages latest.json + binaries
# into apps/cli/public/cli for Cloudflare. Wrangler only uploads that static tree.
mise run build-cli -- --release
pnpm exec wrangler deploy --cwd apps/cli
"""

[tasks.dev-cli]
description = "Stage Go CDN binaries then run apps/cli Cloudflare assets locally with Wrangler"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
bash scripts/stage-cli-cdn.sh
pnpm exec wrangler dev --cwd apps/cli
"""

# ── Harness images (maintainer) ─────────────────────────────

[tasks.build]
description = "Build a container harness def (buildx; host arch --load)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Maintainer image build orchestration is Go now (proveo build -> internal/maintain).
# `go run` keeps it on the current repo source, never a possibly-stale installed
# proveo; the ~1-2s compile is noise next to a docker build.
# Forwards: [target|all] [--tag T] [--no-cache] [--print]
# Images use defs/lib/docker-build.sh (buildx). Local builds --load the host
# platform; PROVEO_PLATFORMS defaults to linux/amd64,linux/arm64 for deploy --push.
exec go run ./cmd/proveo build "$@"
"""

[tasks.test-defs]
description = "Test a container harness def's image (Go: proveo test)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec go run ./cmd/proveo test "$@"
"""

[tasks.deploy]
description = "Buildx --push multi-arch (amd64+arm64) container image def"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec go run ./cmd/proveo deploy "$@"
"""

[tasks.debug]
description = "Debug a container harness def (shell via proveo run --shell)"
depends = ["build-cli"]
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_ROOT="$(pwd)"
DEFAULT_TAG="latest"

# Prefer the binary just installed by build-cli over a random PATH proveo.
export PATH="$(go env GOPATH)/bin:$PATH"
export PROVEO_BIN="$(command -v proveo)"

source "$REPO_ROOT/lib/ui.sh"
source "$REPO_ROOT/lib/helpers.sh"
source "$REPO_ROOT/lib/registry.sh"

target=""
tag="$DEFAULT_TAG"

# Parse arguments cleanly, supporting optional target parameter
while [[ $# -gt 0 ]]; do
  case "$1" in
    --tag)
      if [[ $# -lt 2 ]]; then
        print_error "--tag requires a value"
        exit 1
      fi
      tag="$2"
      shift 2
      ;;
    --)
      shift
      break
      ;;
    -*)
      print_error "Unknown debug option: $1"
      exit 1
      ;;
    *)
      if [[ -z "$target" ]]; then
        target="$1"
      else
        print_error "Multiple debug targets specified: $target and $1"
        exit 1
      fi
      shift
      ;;
  esac
done

# If no target specified, show interactive TUI selector
if [[ -z "$target" ]]; then
  debug_options=()
  for t in "${TARGETS[@]}"; do
    debug_options+=("$t")
  done

  printf '\\nSelect debug target:\\n' >&2
  choice=0
  tui_select "${debug_options[@]}" || choice=$?

  if [[ $choice -eq 255 ]]; then
    echo "Debug cancelled." >&2
    exit 0
  fi

  target="${TARGETS[$choice]}"
fi

require_tag "$tag" "debug"
require_target "$target"
debug_target "$target" "$tag" "$@"
"""
